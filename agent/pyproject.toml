[project]
name = "infrapulse-agent"
version = "1.0.0"
description = "InfraPulse monitoring agent: collects host metrics and reports them"
requires-python = ">=3.10"
dependencies = [
  "psutil>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infrapulse_agent"]
